<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login – Contact Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; padding: 32px; width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    h2 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #4a90e2; }
    button { width: 100%; padding: 11px; background: #4a90e2; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    button:hover { background: #357abd; }
    .msg { font-size: 13px; margin-top: 10px; text-align: center; }
    .error { color: #e74c3c; }
    .link { text-align: center; margin-top: 16px; font-size: 14px; }
    .link a { color: #4a90e2; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <h2>📋 Contact Manager</h2>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Password"/>
  </div>
  <div id="msg" class="msg error" style="display:none"></div>
  <button onclick="doLogin()">Sign In</button>
  <div class="link">Don't have an account? <a href="/register">Register</a></div>
</div>

<script>
  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.style.display = 'none';

    if (!email || !password) { showError('Please fill in all fields.'); return; }

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (res.ok) {
      sessionStorage.setItem('jwt', data.token);
      sessionStorage.setItem('username', data.username);
      window.location.href = '/contacts';
    } else {
      showError(data.message || 'Invalid credentials');
    }
  }

  function showError(text) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.style.display = 'block';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
