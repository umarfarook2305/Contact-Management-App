<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register – Contact Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; padding: 32px; width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    h2 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #4a90e2; }
    button { width: 100%; padding: 11px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    button:hover { background: #1e8449; }
    .msg { font-size: 13px; margin-top: 10px; text-align: center; }
    .error { color: #e74c3c; }
    .success { color: #27ae60; }
    .link { text-align: center; margin-top: 16px; font-size: 14px; }
    .link a { color: #4a90e2; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <h2>Create Account</h2>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Username (min 3 chars)"/>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters"/>
  </div>
  <div id="msg" class="msg" style="display:none"></div>
  <button onclick="doRegister()">Register</button>
  <div class="link">Already have an account? <a href="/login">Sign In</a></div>
</div>

<script>
  async function doRegister() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.style.display = 'none';

    if (!username || !email || !password) { showMsg('Please fill in all fields.', 'error'); return; }

    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();
    if (res.ok) {
      showMsg('Registered successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      showMsg(data.message || 'Registration failed', 'error');
    }
  }

  function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
    msg.style.display = 'block';
  }
</script>
</body>
</html>
