name: CI-CD Pipeline (Docker + Azure)

on:
  push:
    branches: [develop, prod]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/contact-app

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile & Package
        run: mvn clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: target/*.jar


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn test -B


  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy-dev:
    name: Deploy to DEV (Azure)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service (DEV)
        uses: azure/webapps-deploy@v3
        with:
          app-name: Contact-app
          images: ${{ secrets.DOCKER_USERNAME }}/contact-app:${{ github.sha }}


  deploy-prod:
    name: Deploy to PROD (Azure)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/prod'
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service (PROD)
        uses: azure/webapps-deploy@v3
        with:
          app-name: Contact-app
          images: ${{ secrets.DOCKER_USERNAME }}/contact-app:${{ github.sha }}

  deploy-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop'
  
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/contact-app \
            contact-app=${{ secrets.DOCKER_USERNAME }}/contact-app:${{ github.sha }} \
            -n contact-app
          kubectl rollout status deployment/contact-app -n contact-app