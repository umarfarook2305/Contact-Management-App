name: CI-CD Pipeline (Docker)

on:
  push:
    branches: [develop, prod]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/contact-app

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile Code
        run: mvn clean compile -B


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn test -B


  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy-dev:
    name: Deploy to DEV (Azure Ready)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy DEV
        run: echo "🚀 DEV deployment ready (Azure App Service step goes here)"


  deploy-prod:
    name: Deploy to PROD (Azure Ready)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Deploy PROD
        run: echo "🚀 PROD deployment ready (Azure App Service step goes here)" explain this step by step clearly